[project]
name = "blog"
version = "0.1.0"
description = "Just a blog"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altair>=5.4.0",
    "cairosvg>=2.8.2",
    "duckdb>=1.4.3",
    "marimo>=0.23.16",
    "matplotlib>=3.10.8",
    "mkdocs>=1.6.1",
    "mkdocs-blog-plugin>=0.25",
    "mkdocs-material>=9.7.1",
    "mkdocs-rss-plugin>=1.17.1",
    "numpy>=2.4.1",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "pymdown-extensions>=10.19.1",
    "python-markdown-math>=0.9",
    # Both are marimo cache dependencies, and both fail *quietly*: without
    # pyarrow a cached Arrow IPC blob cannot be read back ("pyarrow is required
    # to load cached Arrow IPC blobs"), so the entry is a permanent miss;
    # without cryptography the lazy loader drops from mode='verify' to 'off' and
    # cache entries are neither signed nor verified.
    "pyarrow>=18.0.0",
    "cryptography>=44.0.0",
]

# Islands are exported by re-running each post's notebook at build time. Cell
# caching lets an unchanged cell restore its output instead of re-executing,
# which is what keeps a full-site build from re-running every post's kernel.
[tool.marimo.runtime]
cache_cells = true
# The browser half of a hybrid island never sees this config, so it hashes with
# `mo.persistent_cache`'s own default of pin_modules=False. Exporting turns
# cache_cells on unconditionally, and that lifecycle defaults pin_modules=True,
# so every module ref (`mo`, `re`, ...) hashes differently on the two sides and
# any execution-path key downstream of an import misses in the browser. Pinning
# it False here is what makes the two agree.
pin_modules = false

# Publish-time only (the syndication poster, bin/syndicate.py). Kept out of the
# default deps so the site build / CI stays lean: `uv sync --group publish`.
[dependency-groups]
publish = [
    "atproto>=0.0.55",
    "mastodon-py>=1.8.1",
]
